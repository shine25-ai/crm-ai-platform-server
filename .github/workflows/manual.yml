name: Deploy CRM AI Backend

on:
  push:
    branches:
      - main   # Change if you deploy from another branch

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Backend
        run: npm run build

      - name: Upload Backend Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist-server/**,package.json,package-lock.json"
          target: "/root/crm/crm-ai-platform-server"
          strip_components: 0

      - name: Restart Backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/crm/crm-ai-platform-server

            npm install --omit=dev

            pm2 restart crm-ai-platform --update-env || pm2 start npm --name crm-ai-platform -- run prod

            pm2 save
